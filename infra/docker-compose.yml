services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: dfrs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: dfrs-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - '9092:9092'

  postgres:
    image: postgres:15.5
    container_name: dfrs-postgres
    environment:
      POSTGRES_USER: dfrs
      POSTGRES_PASSWORD: dfrs
      POSTGRES_DB: dfrs
    ports:
      - '5432:5432'
    volumes:
      - dfrs_pgdata:/var/lib/postgresql/data

volumes:
  dfrs_pgdata:
